server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /cosmos-rpc/ {
        proxy_pass http://validator-0:26657/;
    }

    location ~ ^/kudora-local-(config|wallets)\.json$ {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
}
